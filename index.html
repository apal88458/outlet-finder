
<!DOCTYPE html>
<html>
<head>
    <title>Employee Login</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; background: #f0f2f5; }
        .login-card { background: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); width: 280px; text-align: center; }
        input { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background: #1a73e8; color: white; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; }
        #error { color: red; font-size: 14px; margin-top: 10px; }
    </style>
</head>
<body>
<div class="login-card">
    <h2>Emp Login</h2>
    <input type="text" id="empId" placeholder="User ID">
    <input type="password" id="password" placeholder="Password">
    <button onclick="login()">Login</button>
    <p id="error"></p>
</div>
<script>
    const API = "https://script.google.com/macros/s/AKfycbxTiAXI4kCsu4ZZafbBUyl2q_8AWIpvD0lmYHHvB4SBBjK-p9gq7o9E6_ObnQkFdvN2/exec";
    async function login() {
        const id = document.getElementById("empId").value.trim();
        const pass = document.getElementById("password").value.trim();
        if(!id || !pass) return;
        const res = await fetch(`${API}?action=login&id=${encodeURIComponent(id)}&pass=${encodeURIComponent(pass)}`);
        const status = await res.text();
        if (status.trim() === "success") {
            window.location.href = "tracking.html?id=" + encodeURIComponent(id);
        } else {
            document.getElementById("error").innerText = "Invalid ID or Password";
        }
    }
    async function login() {
    const id = document.getElementById("empId").value.trim();
    const pass = document.getElementById("password").value.trim();
    const loginBtn = document.querySelector("button"); // Login button ko select kiya
    const errorMsg = document.getElementById("error");

    if(!id || !pass) {
        errorMsg.innerText = "Please enter ID and Password";
        return;
    }

    // 1. Button ko "Loading" state mein daalein
    loginBtn.innerText = "Logging in...";
    loginBtn.disabled = true;
    loginBtn.style.opacity = "0.7";
    loginBtn.style.cursor = "not-allowed";
    errorMsg.innerText = ""; // Purana error saaf karein

    try {
        const res = await fetch(`${API}?action=login&id=${encodeURIComponent(id)}&pass=${encodeURIComponent(pass)}`);
        const status = await res.text();

        if (status.trim() === "success") {
            window.location.href = "tracking.html?id=" + encodeURIComponent(id);
        } else {
            errorMsg.innerText = "Invalid ID or Password";
            // 2. Error aane par button wapas normal karein
            resetButton(loginBtn);
        }
    } catch (err) {
        errorMsg.innerText = "Connection Error! Check Internet.";
        resetButton(loginBtn);
    }
}

// Button ko wapas normal karne ka chota function
function resetButton(btn) {
    btn.innerText = "Login";
    btn.disabled = false;
    btn.style.opacity = "1";
    btn.style.cursor = "pointer";
}
</script>
</body>
</html>
