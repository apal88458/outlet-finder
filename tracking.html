<!DOCTYPE html>
<html>
<head>
<title>Outlet Finder - Final</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<style>
    body{font-family:Arial, sans-serif; margin:15px; background:#f9f9f9}
    .box{background:white; padding:15px; border-radius:8px; box-shadow:0 2px 5px rgba(0,0,0,0.1)}
    input{padding:12px; width:100%; margin-bottom:10px; border:1px solid #ddd; border-radius:5px; box-sizing:border-box; font-size:16px}
    button{padding:12px 15px; cursor:pointer; background:#1a73e8; color:white; border:none; border-radius:5px; width:100%; margin-bottom:10px; font-weight:bold}
    #mapBtn{background:#34a853} #routeBtn{background:#fbbc05; color:black}
    ul{list-style:none; padding:0}
    li{margin-bottom:15px; padding:12px; border:1px solid #eee; border-radius:6px; background:#fff; position: relative; display: flex; justify-content: space-between; align-items: flex-start;}
    
    /* Layout styling for vertical info */
    .content-area { display: flex; flex-direction: column; gap: 4px; flex-grow: 1; }
    .name{font-weight:bold; color:#1a73e8; font-size: 17px;}
    .address{color: #555; font-size: 14px;}
    .dist-info{font-size: 14px; color: #333;}
    .maps-link{display: inline-block; margin-top: 5px; color: #1a73e8; text-decoration: none; font-weight: bold;}

    .remove-btn{background: #ff4d4d; color: white; border: none; border-radius: 50%; width: 28px; height: 28px; cursor: pointer; font-weight: bold; font-size: 18px; display: flex; align-items: center; justify-content: center; margin-left: 10px; flex-shrink: 0;}
    
    #map{height:300px; margin-top:15px; border-radius:8px; display:none}
    #status{background:#d4edda; color:#155724; padding:10px; border-radius:5px; margin-bottom:10px; font-size:14px; text-align:center}
/* Purane .maps-link ko isse badal dein */
.maps-link {
    display: inline-block; 
    margin-top: 5px; 
    color: #32CD32; /* Yahan color red kar diya gaya hai */
    text-decoration: none; 
    font-weight: bold;
}

/* Optional: Jab mouse link par jaye toh thoda dark red dikhe */
.maps-link:hover {
    color: #008000;
    text-decoration: underline;
}

</style>
</head>

<body>

<div id="status">📡 Your Active (ID: <span id="uid"></span>)</div>

<div class="box">
    <h2>Find Outlets</h2>
    <input type="text" id="ids" placeholder="Enter Outlet IDs then press Enter">
    
    <button id="findBtn" onclick="findOutlets()">Find & Track (or Press Enter)</button>
    <button id="mapBtn" style="display:none" onclick="showAllOnMap()">Show All on Map</button>
    <button id="routeBtn" style="display:none" onclick="openFullRoute()">Start Full Route</button>
    
    <ul id="result"></ul>
    <div id="map"></div>
</div>

<script>
const API = "https://script.google.com/macros/s/AKfycbxTiAXI4kCsu4ZZafbBUyl2q_8AWIpvD0lmYHHvB4SBBjK-p9gq7o9E6_ObnQkFdvN2/exec";
const SHEET_ID = "1u7RN-0d34sy01gXlJjc16C-ZTOdsQPj94X9NXSWabqo";

const urlParams = new URLSearchParams(window.location.search);
const empId = urlParams.get("id");

if(!empId || empId === "null") {
    alert("Session Error! Please login again.");
    window.location.href = "index.html";
} else {
    document.getElementById("uid").innerText = empId;
    setInterval(() => {
        navigator.geolocation.getCurrentPosition(pos => {
            fetch(`${API}?id=${encodeURIComponent(empId)}&lat=${pos.coords.latitude}&lng=${pos.coords.longitude}`, { mode: 'no-cors' });
        }, null, {enableHighAccuracy:true});
    }, 15000);
}

document.getElementById("ids").addEventListener("keypress", function(event) {
    if (event.key === "Enter") {
        event.preventDefault();
        findOutlets();
    }
});

let outletsData = [], map;

function getDistance(lat1, lon1, lat2, lon2) {
    const R = 6371;
    const dLat = (lat2 - lat1) * Math.PI / 180;
    const dLon = (lon2 - lon1) * Math.PI / 180;
    const a = Math.sin(dLat/2)**2 + Math.cos(lat1*Math.PI/180) * Math.cos(lat2*Math.PI/180) * Math.sin(dLon/2)**2;
    return 2 * R * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}

async function findOutlets() {
    const rawIds = document.getElementById("ids").value;
    if (!rawIds) return alert("Bhai, IDs toh dalo!");

    const ids = rawIds.split(/[\s,]+/).map(x => x.trim()).filter(x => x);

    navigator.geolocation.getCurrentPosition(async (pos) => {
        const userLat = pos.coords.latitude;
        const userLon = pos.coords.longitude;

        const res = await fetch(`https://opensheet.elk.sh/${SHEET_ID}/location`);
        const data = await res.json();

        let filtered = data.filter(d => ids.includes(String(d["Outlet Id"])));
        if (!filtered.length) return alert("No data found");

        let sorted = [];
        let pool = [...filtered];
        let currentLat = userLat;
        let currentLon = userLon;

        while(pool.length > 0) {
            let nearestIdx = 0;
            let minDist = Infinity;

            for(let i=0; i<pool.length; i++) {
                let d = getDistance(currentLat, currentLon, parseFloat(pool[i].Latitude), parseFloat(pool[i].Longitude));
                if(d < minDist) {
                    minDist = d;
                    nearestIdx = i;
                }
            }

            let chosen = pool.splice(nearestIdx, 1)[0];
            sorted.push({
                name: chosen["Outlet Name"],
                address: chosen["Address"],
                lat: parseFloat(chosen.Latitude),
                lng: parseFloat(chosen.Longitude),
                link: chosen["Location"],
                distFromPrev: minDist // This stores distance from last point
            });
            currentLat = sorted[sorted.length-1].lat;
            currentLon = sorted[sorted.length-1].lng;
        }

        outletsData = sorted;
        renderResults();

        document.getElementById("mapBtn").style.display="block";
        document.getElementById("routeBtn").style.display="block";
    });
}

function renderResults() {
    const ul = document.getElementById("result");
    ul.innerHTML = "";
    outletsData.forEach((r, index) => {
        const li = document.createElement("li");
        
        // Label logic: First one is from User, others from Previous Shop
        const distLabel = index === 0 ? "Distance from You" : "Distance from last shop";
        
        li.innerHTML = `
            <div class="content-area">
                <div class="name">${r.name}</div>
                <div class="address">${r.address||"No Address"}</div>
                <div class="dist-info"><b>${distLabel}:</b> ${r.distFromPrev.toFixed(2)} km</div>
                <a class="maps-link" href="${r.link}" target="_blank"> 📍 Open Location</a>
            </div>
            <button class="remove-btn" onclick="removeItem(${index})">×</button>
        `;
        ul.appendChild(li);
    });
}

function removeItem(index) {
    outletsData.splice(index, 1);
    // After removing, we don't recalculate distances to keep the sequence logic simple
    renderResults();
}

function showAllOnMap() {
    document.getElementById("map").style.display="block";
    navigator.geolocation.getCurrentPosition(pos => {
        const {latitude:lat, longitude:lng} = pos.coords;
        if(!map) {
            map = L.map('map').setView([lat, lng], 13);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
        }
        map.eachLayer((layer) => {
            if (layer instanceof L.Marker) { map.removeLayer(layer); }
        });
        L.marker([lat, lng]).addTo(map).bindPopup("You are here");
        outletsData.forEach(o => {
            if(o.lat && o.lng) {
                let marker = L.marker([o.lat, o.lng]).addTo(map)
                .bindTooltip(o.name, {permanent:true, direction:"top"});
                marker.on('click', function () {
                    window.open(`https://www.google.com/maps?q=${o.lat},${o.lng}`, "_blank");
                });
            }
        });
    });
}

function openFullRoute() {
    navigator.geolocation.getCurrentPosition(pos => {
        let points = [`${pos.coords.latitude},${pos.coords.longitude}`];
        outletsData.forEach(o => points.push(`${o.lat},${o.lng}`));
        window.open("https://www.google.com/maps/dir/" + points.join("/"), "_blank");
    });
}
    async function findOutlets() {
    const rawIds = document.getElementById("ids").value;
    const findBtn = document.getElementById("findBtn"); // Button element ko select kiya

    if (!rawIds) return alert("Bhai, IDs toh dalo!");

    // 1. Button ka text badal kar "Searching..." karein aur disable karein
    findBtn.innerText = "Searching...";
    findBtn.disabled = true;
    findBtn.style.opacity = "0.7";

    const ids = rawIds.split(/[\s,]+/).map(x => x.trim()).filter(x => x);

    navigator.geolocation.getCurrentPosition(async (pos) => {
        try {
            const userLat = pos.coords.latitude;
            const userLon = pos.coords.longitude;

            const res = await fetch(`https://opensheet.elk.sh/${SHEET_ID}/location`);
            const data = await res.json();

            let filtered = data.filter(d => ids.includes(String(d["Outlet Id"])));
            
            if (!filtered.length) {
                alert("No data found");
            } else {
                // ... (Aapka baki ka sorting logic yahan rahega)
                let sorted = [];
                let pool = [...filtered];
                let currentLat = userLat;
                let currentLon = userLon;

                while(pool.length > 0) {
                    let nearestIdx = 0;
                    let minDist = Infinity;
                    for(let i=0; i<pool.length; i++) {
                        let d = getDistance(currentLat, currentLon, parseFloat(pool[i].Latitude), parseFloat(pool[i].Longitude));
                        if(d < minDist) {
                            minDist = d;
                            nearestIdx = i;
                        }
                    }
                    let chosen = pool.splice(nearestIdx, 1)[0];
                    sorted.push({
                        name: chosen["Outlet Name"],
                        address: chosen["Address"],
                        lat: parseFloat(chosen.Latitude),
                        lng: parseFloat(chosen.Longitude),
                        link: chosen["Location"],
                        distFromPrev: minDist
                    });
                    currentLat = sorted[sorted.length-1].lat;
                    currentLon = sorted[sorted.length-1].lng;
                }

                outletsData = sorted;
                renderResults();
                document.getElementById("mapBtn").style.display="block";
                document.getElementById("routeBtn").style.display="block";
            }
        } catch (error) {
            alert("Error fetching data!");
        } finally {
            // 2. Kaam khatam hone ke baad button ko wapas normal karein
            findBtn.innerText = "Find & Track (or Press Enter)";
            findBtn.disabled = false;
            findBtn.style.opacity = "1";
        }
    }, (err) => {
        alert("Location access denied!");
        findBtn.innerText = "Find & Track (or Press Enter)";
        findBtn.disabled = false;
        findBtn.style.opacity = "1";
    });
}
</script>
</body>
</html>
