<!DOCTYPE html>
<html>
<head>
<title>Outlet Finder - Final</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<style>
    body{font-family:Arial, sans-serif; margin:15px; background:#f9f9f9}
    .box{background:white; padding:15px; border-radius:8px; box-shadow:0 2px 5px rgba(0,0,0,0.1)}
    input{padding:12px; width:100%; margin-bottom:10px; border:1px solid #ddd; border-radius:5px; box-sizing:border-box; font-size:16px}
    button{padding:12px 15px; cursor:pointer; background:#1a73e8; color:white; border:none; border-radius:5px; width:100%; margin-bottom:10px; font-weight:bold}
    #mapBtn{background:#34a853} #routeBtn{background:#fbbc05; color:black}
    ul{list-style:none; padding:0}
    li{margin-bottom:15px; padding:12px; border:1px solid #eee; border-radius:6px; background:#fff; position: relative; display: flex; justify-content: space-between; align-items: center;}
    .name{font-weight:bold; color:#1a73e8}
    .remove-btn{background: #ff4d4d; color: white; border: none; border-radius: 50%; width: 25px; height: 25px; cursor: pointer; font-weight: bold; font-size: 14px; line-height: 1; margin-left: 10px;}
    #map{height:300px; margin-top:15px; border-radius:8px; display:none}
    #status{background:#d4edda; color:#155724; padding:10px; border-radius:5px; margin-bottom:10px; font-size:14px; text-align:center}
    .content-area { flex-grow: 1; }
</style>
</head>

<body>

<div id="status">📡 Your Active (ID: <span id="uid"></span>)</div>

<div class="box">
    <h2>Find Outlets</h2>
    <input type="text" id="ids" placeholder="Enter Outlet IDs then press Enter">
    
    <button id="findBtn" onclick="findOutlets()">Find & Track (or Press Enter)</button>
    <button id="mapBtn" style="display:none" onclick="showAllOnMap()">Show All on Map</button>
    <button id="routeBtn" style="display:none" onclick="openFullRoute()">Start Full Route</button>
    
    <ul id="result"></ul>
    <div id="map"></div>
</div>

<script>
// --- CONFIGURATION ---
const API = "https://script.google.com/macros/s/AKfycbxTiAXI4kCsu4ZZafbBUyl2q_8AWIpvD0lmYHHvB4SBBjK-p9gq7o9E6_ObnQkFdvN2/exec";
const SHEET_ID = "1u7RN-0d34sy01gXlJjc16C-ZTOdsQPj94X9NXSWabqo";

const urlParams = new URLSearchParams(window.location.search);
const empId = urlParams.get("id");

if(!empId || empId === "null") {
    alert("Session Error! Please login again.");
    window.location.href = "index.html";
} else {
    document.getElementById("uid").innerText = empId;
    setInterval(() => {
        navigator.geolocation.getCurrentPosition(pos => {
            fetch(`${API}?id=${encodeURIComponent(empId)}&lat=${pos.coords.latitude}&lng=${pos.coords.longitude}`, { mode: 'no-cors' });
        }, null, {enableHighAccuracy:true});
    }, 15000);
}

document.getElementById("ids").addEventListener("keypress", function(event) {
    if (event.key === "Enter") {
        event.preventDefault();
        findOutlets();
    }
});

let outletsData = [], map;

function getDistance(lat1, lon1, lat2, lon2) {
    const R = 6371;
    const dLat = (lat2 - lat1) * Math.PI / 180;
    const dLon = (lon2 - lon1) * Math.PI / 180;
    const a = Math.sin(dLat/2)**2 + Math.cos(lat1*Math.PI/180) * Math.cos(lat2*Math.PI/180) * Math.sin(dLon/2)**2;
    return 2 * R * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}

async function findOutlets() {
    const rawIds = document.getElementById("ids").value;
    if (!rawIds) return alert("Bhai, IDs toh dalo!");

    const ids = rawIds.split(/[\s,]+/).map(x => x.trim()).filter(x => x);

    navigator.geolocation.getCurrentPosition(async (pos) => {
        const userLat = pos.coords.latitude;
        const userLon = pos.coords.longitude;

        const res = await fetch(`https://opensheet.elk.sh/${SHEET_ID}/location`);
        const data = await res.json();

        let filtered = data.filter(d => ids.includes(String(d["Outlet Id"])));
        if (!filtered.length) return alert("No data found");

        outletsData = filtered.map(o => ({
            name: o["Outlet Name"],
            address: o["Address"],
            lat: parseFloat(o.Latitude),
            lng: parseFloat(o.Longitude),
            link: o["Location"],
            dist: getDistance(userLat, userLon, parseFloat(o.Latitude), parseFloat(o.Longitude))
        }));

        const ul = document.getElementById("result");
        ul.innerHTML = "";
        outletsData.forEach(r => {
            const li = document.createElement("li");
            li.innerHTML = `<div class="name">${r.name}</div><div>${r.address||""}</div><div><b>Distance:</b> ${r.dist.toFixed(2)} km</div><a href="${r.link}" target="_blank">Google Maps</a>`;
            ul.appendChild(li);
        });

        document.getElementById("mapBtn").style.display="block";
        document.getElementById("routeBtn").style.display="block";
    });
}

function showAllOnMap() {
    document.getElementById("map").style.display="block";

    navigator.geolocation.getCurrentPosition(pos => {
        const {latitude:lat, longitude:lng} = pos.coords;

        if(!map) {
            map = L.map('map').setView([lat, lng], 13);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
        }

        L.marker([lat, lng]).addTo(map).bindPopup("You are here");

        // ✅ ONLY CHANGE ADDED HERE
        outletsData.forEach(o => {
            if(o.lat && o.lng) {
                let marker = L.marker([o.lat, o.lng]).addTo(map)
                .bindTooltip(o.name, {permanent:true, direction:"top"});

                marker.on('click', function () {
                    window.open(`https://www.google.com/maps?q=${o.lat},${o.lng}`, "_blank");
                });
            }
        });

    });
}

function openFullRoute() {
    navigator.geolocation.getCurrentPosition(pos => {
        let points = [`${pos.coords.latitude},${pos.coords.longitude}`];
        outletsData.forEach(o => points.push(`${o.lat},${o.lng}`));
        window.open("https://www.google.com/maps/dir/" + points.join("/"), "_blank");
    });
}
</script>
</body>
</html>
